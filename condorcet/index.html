<body v-scope>

<div class="empty-state" id="emptyState" v-show="!scrutin" v-cloak>
  <div class="emoji">&#x1f5f3;</div>
  <h1>Scrutin de Condorcet</h1>
  <p>Aucun scrutin en cours.</p>
  <button class="cta" id="btnOpenCreate" @click="openCreate()">Créer un scrutin</button>

<div class="modal" id="createModal" :class="{open: ui.createOpen}" v-cloak>
  <div class="modal-panel">
    <h2>Nouveau scrutin</h2>

    <label>Titre

             placeholder="Quel film ce soir&nbsp;?">
    </label>

    <fieldset>

    </fieldset>

    <fieldset>
      <legend>Votants</legend>

                 :placeholder="'Votant ' + (i+1)">

    <fieldset>
      <legend>Mode</legend>
      <label><input type="radio" name="mode" value="shared-device" v-model="ui.form.mode">
        Appareil partagé (tour de rôle)</label>
      <label><input type="radio" name="mode" value="per-device" v-model="ui.form.mode" disabled>
        Un appareil par personne <em>(sync à venir)</em></label>
    </fieldset>

    <div class="modal-actions">
      <button class="secondary" @click="ui.createOpen = false">Annuler</button>
      <button class="primary" id="btnConfirmCreate"
              :disabled="!canCreate"
              @click="createScrutin()">Créer</button>

</div>
<div class="share-bar" v-show="scrutin && !scrutin.closed && stage === 'pass'" v-cloak>

        <thead>

            <th></th>
            <template v-for="c in scrutin.candidates" :key="'h'+c">
              <th v-text="c"></th>

        <tbody>
          <template v-for="a in scrutin.candidates" :key="'r'+a">
            <tr>
              <th v-text="a"></th>
              <template v-for="b in scrutin.candidates" :key="'c'+a+b">
                <td :class="{self: a === b, wins: a !== b && tally.pairwise[a][b] > tally.pairwise[b][a]}"
                    v-text="a === b ? '—' : tally.pairwise[a][b]"></td>
              </template>
            </tr>
          </template>

      <template v-if="tally.kind === 'random-smith'">
        <div class="smith-note">
          <h3>Aucun vainqueur strict --- Smith set</h3>
          <p>Pas de candidat ne bat tous les autres en duel : il y a un
          cycle. Le Smith set est le plus petit ensemble dominant. On y
          tire au sort avec une graine reproductible calculée sur les
          bulletins clos.</p>
          <ul>
            <template v-for="c in tally.smith" :key="'s'+c">
              <li v-text="c"></li>
            </template>

</div>

<script type="module">
import { createApp } from 'petite-vue';
import Sortable from 'sortablejs';
import qrcode from 'qrcode-generator';
window.qrcode = qrcode;
window.Sortable = Sortable;

import * as Automerge from '@automerge/automerge';
import { Repo } from 'https://esm.sh/@automerge/automerge-repo@1.2.1/dist/Repo';
import { isValidAutomergeUrl } from 'https://esm.sh/@automerge/automerge-repo@1.2.1/dist/AutomergeUrl';
import { IndexedDBStorageAdapter } from 'https://esm.sh/@automerge/automerge-repo-storage-indexeddb@1';
import { BrowserWebSocketClientAdapter } from 'https://esm.sh/@automerge/automerge-repo-network-websocket@1/dist/BrowserWebSocketClientAdapter';

const WASM_URL = 'https://esm.sh/@automerge/automerge@2.2.9/dist/automerge.wasm';

async function initAutomerge(){
  await Automerge.initializeWasm(fetch(WASM_URL));
}

async function makeRepo(){
  const params = new URLSearchParams(location.search);
  const fromParam = params.get('sync_url');
  if(fromParam){
    localStorage.setItem('condorcet.sync_url', fromParam);
    const clean = new URL(location);
    clean.searchParams.delete('sync_url');
    history.replaceState(null, '', clean);
  }
  const syncUrl = localStorage.getItem('condorcet.sync_url');
  const network = syncUrl ? [new BrowserWebSocketClientAdapter(syncUrl)] : [];
  return new Repo({
    storage: new IndexedDBStorageAdapter('condorcet'),
    network,
  });
}

async function loadInitialHandle(repo){
  const urlParam = new URLSearchParams(location.search).get('doc');
  if(!urlParam || !isValidAutomergeUrl(urlParam)) return null;
  const handle = repo.find(urlParam);
  // On attend au plus 3s pour que le handle soit résolu (typiquement
  // depuis IndexedDB en quelques ms ; plus long si via WebSocket). Si
  // ça dépasse on rend la main : le store s'abonne à =change= et se
  // remplit quand le doc arrive, sans bloquer =data-app-ready=.
  await Promise.race([
    handle.whenReady(['ready', 'unavailable']).catch(() => {}),
    new Promise(r => setTimeout(r, 3000)),
  ]);
  return handle;
}

function pairwiseMatrix(candidates, ballots){
  const m = {};
  for(const a of candidates){
    m[a] = {};
    for(const b of candidates) if(b !== a) m[a][b] = 0;
  }
  for(const ballot of ballots){
    const pos = {};
    ballot.ranking.forEach((c, i) => { pos[c] = i; });
    for(let i = 0; i < candidates.length; i++){
      for(let j = i+1; j < candidates.length; j++){
        const a = candidates[i], b = candidates[j];
        if(a in pos && b in pos){
          if(pos[a] < pos[b]) m[a][b]++;
          else m[b][a]++;
        }
      }
    }
  }
  return m;
}

function condorcetWinner(candidates, m){
  for(const c of candidates){
    const beatsAll = candidates.every(o => o === c || m[c][o] > m[o][c]);
    if(beatsAll) return c;
  }
  return null;
}

function smithSet(candidates, m){
  // Plus petit ensemble S tel que chaque membre de S bat tout non-membre.
  // On part de l'ensemble complet et on éjecte quiconque est battu par
  // un extérieur qui ne le bat pas en retour.
  let smith = new Set(candidates);
  let changed = true;
  while(changed){
    changed = false;
    for(const c of Array.from(smith)){
      const outsiders = candidates.filter(o => !smith.has(o));
      const beatenByOutside = outsiders.some(o => m[o][c] > m[c][o]);
      if(beatenByOutside){ smith.delete(c); changed = true; }
    }
  }
  return Array.from(smith).sort();
}

async function seedFromBallots(ballots){
  const normalised = ballots
    .map(b => ({voter: b.voter, ranking: b.ranking}))
    .sort((a, b) => a.voter.localeCompare(b.voter));
  const payload = JSON.stringify(normalised);
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(payload));
  return new Uint8Array(buf);
}

function mulberry32(seed){
  let a = seed >>> 0;
  return function(){
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

async function computeTally(scrutin){
  const m = pairwiseMatrix(scrutin.candidates, scrutin.ballots);
  const w = condorcetWinner(scrutin.candidates, m);
  if(w) return { kind: 'condorcet', winner: w, pairwise: m };
  const smith = smithSet(scrutin.candidates, m);
  const seedBytes = await seedFromBallots(scrutin.ballots);
  const seedInt = new DataView(seedBytes.buffer).getUint32(0);
  const rng = mulberry32(seedInt);
  const pick = smith[Math.floor(rng() * smith.length)];
  const seedShort = Array.from(seedBytes.slice(0, 4))
    .map(b => b.toString(16).padStart(2, '0')).join('');
  return { kind: 'random-smith', winner: pick, smith, pairwise: m, seedShort };
}

function shuffled(arr){
  const a = arr.slice();
  for(let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

// Le repo et le handle vivent hors du store réactif : petite-vue
// enveloppe le data dans un Proxy, ce qui casse les private fields (#)
// utilisés par la classe Repo ("Receiver must be an instance of ...").
// On garde un handle non-réactif côté module, et on n'expose au store
// qu'un snapshot du doc (déjà plain JSON).
let _repo = null;
let _handle = null;
let _sortable = null;

const voteStore = {
  scrutin: null,
  tally: null,
  stage: 'pass',       // 'pass' | 'ballot'
  currentVoter: null,
  ui: {
    createOpen: false,
    form: {
      title: '',
      candidates: ['', ''],
      voters: [''],
      mode: 'shared-device',
    },
    ranking: [],
    qrOpen: false,
    qrSvg: '',
    shareUrl: '',
    shareToast: '',
  },

  // derived (petite-vue : getters sur l'objet data, évalués à chaque accès).
  // Les getters ne doivent PAS retourner de Set/Map : la reactivité de
  // petite-vue tente de les proxifier et échoue ("non-object as target").
  get rosterCount(){ return this.scrutin ? this.scrutin.voters.length : 0; },
  get ballotsCount(){ return this.scrutin ? this.scrutin.ballots.length : 0; },
  get nextVoter(){
    if(!this.scrutin) return null;
    const voted = {};
    for(const b of this.scrutin.ballots) voted[b.voter] = true;
    return this.scrutin.voters.find(v => !voted[v]) || null;
  },
  get canCreate(){
    const f = this.ui.form;
    const cs = f.candidates.map(s => s.trim()).filter(Boolean);
    const vs = f.voters.map(s => s.trim()).filter(Boolean);
    return f.title.trim() && cs.length >= 2 && vs.length >= 1;
  },
  get tallyExplanation(){
    if(!this.tally) return '';
    if(this.tally.kind === 'condorcet')
      return 'Vainqueur de Condorcet strict : bat tous les autres en duel.';
    return 'Aucun vainqueur de Condorcet : cycle détecté. Tirage au sort reproductible dans le Smith set.';
  },

  // actions
  openCreate(){ this.ui.createOpen = true; },

  currentShareUrl(){
    return location.origin + location.pathname + location.search;
  },

  async shareScrutin(){
    const url = this.currentShareUrl();
    const title = (this.scrutin && this.scrutin.title) || 'Scrutin';
    if(navigator.share){
      try { await navigator.share({ title, url }); return; }
      catch(e){ /* annulé par l'utilisateur ou pas supporté → fallback clipboard */ }
    }
    try {
      await navigator.clipboard.writeText(url);
      this.ui.shareToast = 'Lien copié';
      setTimeout(() => { this.ui.shareToast = ''; }, 2000);
    } catch(e){
      this.ui.shareToast = 'Copie impossible';
      setTimeout(() => { this.ui.shareToast = ''; }, 2000);
    }
  },

  openQR(){
    const url = this.currentShareUrl();
    const qr = window.qrcode(0, 'M');
    qr.addData(url);
    qr.make();
    this.ui.qrSvg = qr.createSvgTag({ cellSize: 6, margin: 2 });
    this.ui.shareUrl = url;
    this.ui.qrOpen = true;
  },

  change(fn){
    _handle.change(fn);
    this.scrutin = _handle.docSync();
  },

  createScrutin(){
    const f = this.ui.form;
    const candidates = f.candidates.map(s => s.trim()).filter(Boolean);
    const voters = f.voters.map(s => s.trim()).filter(Boolean);
    const handle = _repo.create({
      title: f.title.trim(),
      candidates,
      voters,
      ballots: [],
      closed: false,
      mode: f.mode,
      method: 'condorcet-random-smith',
      createdAt: Date.now(),
    });
    history.replaceState(null, '', '?doc=' + handle.url);
    this.ui.createOpen = false;
    this.attach(handle);
  },

  attach(handle){
    _handle = handle;
    // Peut être undefined si le handle n'est pas encore =ready= (pas
    // encore remonté depuis IndexedDB ou via la sync). Le listener
    // =change= ci-dessous remplira =this.scrutin= quand ça arrive.
    const doc = handle.docSync();
    if(doc){
      this.scrutin = doc;
      if(doc.closed) computeTally(doc).then(t => { this.tally = t; });
    }
    handle.on('change', ev => {
      this.scrutin = ev.doc;
      if(ev.doc.closed && !this.tally){
        computeTally(ev.doc).then(t => { this.tally = t; });
      }
    });
    this.stage = 'pass';
  },

  startBallot(){
    this.currentVoter = this.nextVoter;
    this.ui.ranking = shuffled(this.scrutin.candidates);
    this.stage = 'ballot';
  },

  cancelBallot(){
    this.currentVoter = null;
    this.ui.ranking = [];
    this.stage = 'pass';
  },

  submitBallot(){
    const ranking = this.ui.ranking.slice();
    const voter = this.currentVoter;
    this.change(d => {
      const existing = d.ballots.findIndex(b => b.voter === voter);
      const ballot = { voter, ranking, at: Date.now() };
      if(existing >= 0) d.ballots[existing] = ballot;
      else d.ballots.push(ballot);
    });
    this.cancelBallot();
  },

  async close(){
    this.change(d => { d.closed = true; });
    this.tally = await computeTally(this.scrutin);
  },

  attachSortable(el){
    if(_sortable){ _sortable.destroy(); _sortable = null; }
    const store = this;
    _sortable = window.Sortable.create(el, {
      animation: 150,
      ghostClass: 'sortable-ghost',
      handle: '.rank-item',
      onEnd(){
        const newOrder = Array.from(el.querySelectorAll('.rank-item'))
          .map(li => li.getAttribute('data-candidate'));
        store.ui.ranking = newOrder;
      },
    });
  },
};

window.__voteStore = voteStore;

// Hook de test : force un ranking sans passer par le drag-and-drop.
window.testForceRanking = function(order){
  voteStore.ui.ranking = order.slice();
};

(async function init(){
  await initAutomerge();
  _repo = await makeRepo();
  const handle = await loadInitialHandle(_repo);
  if(handle) voteStore.attach(handle);
  createApp(voteStore).mount('body');
  document.body.setAttribute('data-app-ready', '1');
})();
</script>
