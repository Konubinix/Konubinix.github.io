<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Trigger list</title>
    <script type="importmap">
      {
        "imports": {
          "loro-crdt": "https://esm.sh/loro-crdt@1",
          "idb-keyval": "https://esm.sh/idb-keyval@6",
          "uhtml": "https://esm.sh/uhtml@4"
        }
      }
    </script>
    <style>
      body[data-app-ready] #loading{display:none}
      #loading{padding:60px 20px;text-align:center;color:#8a8ea5;font-family:system-ui,sans-serif}
      body{font-family:system-ui,sans-serif;color:#1b1d2e;margin:0}
      .toolbar{display:flex;justify-content:flex-end;padding:8px 16px;max-width:480px;margin:0 auto;position:sticky;top:0;background:#fff;z-index:10}
      .edit-toggle{padding:8px 14px;border:1px solid #ccc;border-radius:8px;background:#fff;color:#1b1d2e;font:inherit;cursor:pointer}
      .add{display:flex;gap:8px;padding:8px 16px;max-width:480px;margin:0 auto}
      .add input{flex:1;padding:10px 12px;border:1px solid #ccc;border-radius:8px;font:inherit}
      .add select{padding:10px 12px;border:1px solid #ccc;border-radius:8px;font:inherit}
      .add button{padding:10px 16px;border:0;border-radius:8px;background:#1b1d2e;color:#fff;font:inherit;cursor:pointer;white-space:nowrap}
      section{max-width:480px;margin:0 auto}
      h3{padding:0 16px;margin:16px 0 6px;font-size:.85rem;color:#8a8ea5;text-transform:uppercase;letter-spacing:.04em}
      .items{list-style:none;padding:0 16px;margin:0}
      .items li{display:flex;align-items:center;gap:6px;padding:12px 14px;margin-bottom:6px;background:#f2f3f7;border-radius:8px}
      .check{display:flex;align-items:center;gap:10px;cursor:pointer;flex:1}
      .check::before{content:"";width:18px;height:18px;border:2px solid #c4c6d4;border-radius:5px;flex:none}
      .check[aria-checked=true]::before{content:"✓";border-color:#1b1d2e;background:#1b1d2e;color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;line-height:1}
      .items li.done .check{color:#8a8ea5;text-decoration:line-through}
      .row-btn{background:none;border:0;cursor:pointer;color:#8a8ea5;font-size:1rem;line-height:1;padding:4px 6px}
      .row-btn:disabled{opacity:.3;cursor:default}
      .rename-input{flex:1;padding:10px 12px;border:1px solid #ccc;border-radius:8px;font:inherit}
      .empty{text-align:center;color:#8a8ea5;margin-top:40px}
      .outing{max-width:480px;margin:22px auto;padding:2px 0 10px;border:1px solid #e2e3ee;border-radius:12px;background:#fafaff}
      .outing > h2{padding:12px 16px 0;margin:0;font-size:1.05rem;color:#1b1d2e;font-weight:650}
      .outing section{max-width:none;margin:0}
      [data-draggable]{touch-action:none;user-select:none;cursor:grab}
      [data-draggable]:active{cursor:grabbing}
      .drag-source{opacity:.35}
      .drop-hover{outline:2px dashed var(--accent,#f9a826);outline-offset:2px}
      .drag-clone{
          position:fixed;z-index:9999;pointer-events:none;
          padding:10px 14px;border-radius:8px;
          background:var(--accent,#f9a826);color:#111;
          box-shadow:0 8px 24px rgba(0,0,0,.4);
          transform:scale(1.04);opacity:.95;
          font-family:inherit;font-size:inherit;
      }
      .sheet-back{position:fixed;inset:0;background:#0006;display:flex;
                  align-items:center;justify-content:center;z-index:9998}
      .sheet{background:#fff;border-radius:12px;padding:16px;display:flex;flex-wrap:wrap;gap:12px;max-width:320px}
      .sheet-msg{flex-basis:100%;margin:0}
      .sheet button{padding:12px 20px;border:0;border-radius:8px;
                    background:#1b1d2e;color:#fff;font:inherit;cursor:pointer}
    </style>
  </head>
  <body>
    <div id="loading">Loading…</div>
    <div id="app"></div>
    <script type="module" src="app.js"></script>
  </body>
</html>
<!-- How it all fits together:4 ends here -->
