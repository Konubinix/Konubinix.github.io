<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <script>
    if(new URLSearchParams(location.search).has('purge')&&'serviceWorker'in navigator){
      caches.keys().then(function(k){k.forEach(function(n){caches.delete(n)})});
      navigator.serviceWorker.getRegistrations().then(function(r){r.forEach(function(s){s.unregister()})});
      location.replace(location.pathname);
    }
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <link rel="manifest" href="manifest.json">

    <meta name="theme-color" content="#1b1d2e">
    <title>Organiser</title>
    <script>
      if('serviceWorker' in navigator
         && location.hostname !== 'localhost'
         && location.hostname !== '127.0.0.1'){
          navigator.serviceWorker.register('sw.js', {updateViaCache: 'none'});
      }
    </script>
    <script type="importmap">
      {
        "imports": {
          "tinybase": "https://esm.sh/tinybase@5",
          "tinybase/persisters/persister-indexed-db": "https://esm.sh/tinybase@5/persisters/persister-indexed-db",
          "tinybase/synchronizers/synchronizer-ws-client": "https://esm.sh/tinybase@5/synchronizers/synchronizer-ws-client"
        }
      }
    </script>
    <style>
      :root{
          --bg:#1b1d2e; --card:#262a40; --fg:#e8e8f0; --muted:#8a8ea5;
          --accent:#f9a826;
      }
      *{box-sizing:border-box}
      body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,sans-serif;line-height:1.4;min-height:100vh}
      [hidden]{display:none !important}
      #loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:var(--bg);z-index:9999}
      body[data-app-ready] #loading{display:none}
      .loading-ring{width:44px;height:44px;border:3px solid #333;border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite}
      @keyframes spin{to{transform:rotate(360deg)}}
      .build-tag{position:fixed;top:calc(env(safe-area-inset-top) + 8px);left:8px;font-size:.65rem;color:var(--muted);font-family:monospace;pointer-events:none;z-index:50}
      .empty-state{text-align:center;padding:60px 20px;color:var(--muted)}
      .empty-state .emoji{font-size:3rem;margin-bottom:12px}
      .empty-state h1{font-size:1.4rem;margin:0 0 8px 0;color:var(--fg)}
      .empty-state p{font-size:.95rem;line-height:1.5}
      .app-bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:12px 16px;border-bottom:1px solid #2a2d44}
      .app-bar input[type=search]{flex:1 1 100%;background:var(--card);color:var(--fg);border:1px solid #333;border-radius:6px;padding:8px 10px;font:inherit}
      .app-bar button{background:var(--accent);color:#111;padding:8px 14px;border:0;border-radius:6px;font:inherit;font-weight:600;cursor:pointer}
      .app-bar-actions{display:flex;gap:8px;margin-left:auto}
      .sync-status{font-size:.8rem;padding:4px 8px;border-radius:6px;color:var(--muted)}
      .sync-status[data-status=connecting]{color:#f9a826}
      .sync-status[data-status=connected]{color:#06d6a0}
      .sync-status[data-status=disconnected]{color:#e63946}
      .add-form{display:grid;gap:10px;padding:16px;max-width:420px;margin:0 auto}
      .add-form label{display:block;font-size:.9rem;color:var(--muted)}
      .add-form input[type=text]{width:100%;background:var(--card);color:var(--fg);border:1px solid #333;border-radius:6px;padding:8px;font:inherit;margin-top:4px}
      .add-form input[type=color]{width:48px;height:32px;border:0;background:transparent;margin-top:4px;padding:0;cursor:pointer}
      .add-form-actions{display:flex;gap:8px}
      .add-form-actions button{flex:1;padding:10px;border:0;border-radius:6px;font:inherit;font-weight:600;cursor:pointer}
      .add-form-actions button[type=submit]{background:var(--accent);color:#111}
      .add-form-actions button[type=button]{background:var(--card);color:var(--fg)}
      .add-form-actions button.danger{background:#e94560;color:#fff}
      .form-error{margin:0;color:#e94560;font-size:.85rem}
      .boxes-list{list-style:none;padding:0 16px;margin:0 auto;max-width:420px}
      /* The shared =.reorder-item= already gives us =display:flex; align-items:center;
         gap:10px= — exactly the photo / items / grip row layout we want. */
      .boxes-list li.box{padding:8px 14px;background:var(--card);border-radius:8px}
      .boxes-list .box-photo{
          appearance:none;border:1px solid #00000033;padding:0;
          width:48px;height:48px;border-radius:8px;
          overflow:hidden;flex-shrink:0;cursor:pointer;
          background:transparent;
      }
      .boxes-list .box-photo-thumb{display:block;width:100%;height:100%;object-fit:cover}
      .boxes-list .items-in-box{
          flex:1;
          list-style:none;margin:0;padding:0;
          display:flex;flex-wrap:wrap;gap:4px;
      }
      .boxes-list .items-in-box .item{display:flex;align-items:center;gap:6px;padding:6px 10px;background:var(--bg);border-radius:6px;color:var(--fg);font-size:.9rem}
      .boxes-list .reorder-grip{
          appearance:none;border:0;padding:0;
          width:28px;height:28px;
          margin-right:-6px;
          background:transparent;color:var(--muted);
          opacity:.55;border-radius:6px;
          transition:opacity .15s, background-color .15s;
      }
      .boxes-list .reorder-grip:hover{opacity:1;background:rgba(255,255,255,.06)}
      .boxes-list .reorder-grip svg{fill:currentColor;display:block;margin:auto;pointer-events:none}
      .item-thumb{width:24px;height:24px;border-radius:4px;object-fit:cover;flex-shrink:0}
      .item-image-preview,.box-photo-preview{display:block;max-width:120px;max-height:120px;border-radius:6px;margin-top:4px;object-fit:cover}
      .unassigned{padding:0 16px;margin:8px auto 0;max-width:420px}
      .unassigned h2{font-size:.85rem;color:var(--muted);font-weight:600;margin:8px 0;text-transform:uppercase;letter-spacing:.05em}
      .items-list{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:6px}
      .items-list .item{display:flex;align-items:center;gap:8px;padding:10px 14px;background:var(--card);border-radius:8px;color:var(--fg)}
      [data-draggable]{touch-action:none;user-select:none;cursor:grab}
      [data-draggable]:active{cursor:grabbing}
      .drag-source{opacity:.35}
      .drop-hover{outline:2px dashed var(--accent,#f9a826);outline-offset:2px}
      .drag-clone{
          position:fixed;z-index:9999;pointer-events:none;
          padding:10px 14px;border-radius:8px;
          background:var(--accent,#f9a826);color:#111;
          box-shadow:0 8px 24px rgba(0,0,0,.4);
          transform:scale(1.04);opacity:.95;
          font-family:inherit;font-size:inherit;
      }
      .reorder-list{display:flex;flex-direction:column;gap:6px;margin-bottom:8px;position:relative}
      .reorder-item{
          display:flex;align-items:center;gap:10px;
          padding:10px 14px;background:rgba(255,255,255,.05);border-radius:12px;
          user-select:none;
      }
      .reorder-item.drag-placeholder{
          opacity:.3;border:2px dashed rgba(255,255,255,.25);background:transparent;
      }
      .drag-clone{
          position:fixed;z-index:9999;pointer-events:none;
          display:flex;align-items:center;gap:10px;
          padding:10px 14px;border-radius:12px;
          background:var(--accent);color:#fff;
          box-shadow:0 8px 24px rgba(0,0,0,.4);
          transform:scale(1.04);opacity:.95;
          font-family:inherit;font-size:inherit;
      }
      .drag-clone .reorder-grip{color:#fff}
      .reorder-grip{
          display:grid;place-items:center;width:36px;height:36px;
          cursor:grab;touch-action:none;color:var(--muted);font-size:1.2rem;
          flex-shrink:0;border-radius:8px;
      }
      .reorder-grip:active{cursor:grabbing;background:rgba(255,255,255,.1)}
      .reorder-rank{font-weight:800;font-size:1.1rem;min-width:1.4em;text-align:center}
      .reorder-name{flex:1;font-weight:600}
    </style>
  </head>
  <body>
    <div id="loading"><div class="loading-ring"></div></div>
    <span class="build-tag" title="Build">48ecbe4</span>
    <header class="app-bar">
      <span class="sync-status" data-sync-status data-status="off" role="status">Sync off</span>
      <div class="app-bar-actions">
        <button type="button" data-open-add>Add a box</button>
        <button type="button" data-open-add-item>Add an item</button>
      </div>
      <input type="search" placeholder="Search…" data-search aria-label="Search">
    </header>
    <div class="empty-state" data-empty-state hidden>
      <div class="emoji">&#x1f4e6;</div>
      <h1>Organiser</h1>
      <p>No boxes yet.</p>
    </div>
    <form class="add-form" data-add-form hidden>
      <label>Photo
        <input type="file" id="addBoxPhoto" accept="image/*" capture="environment">
      </label>
      <img class="box-photo-preview" data-box-photo-preview alt="Photo preview" hidden>
      <div class="add-form-actions">
        <button type="submit">Save</button>
        <button type="button" data-cancel-add>Cancel</button>
        <button type="button" class="danger" data-delete-box hidden>Delete</button>
      </div>
    </form>
    <form class="add-form" data-add-item-form hidden>
      <label>Item name
        <input type="text" id="addItemName" placeholder="e.g. 3mm screw" required>
      </label>
      <p class="form-error" role="alert" data-item-name-error hidden>An item with this name already exists.</p>
      <label>Image
        <input type="file" id="addItemImage" accept="image/*" capture="environment">
      </label>
      <img class="item-image-preview" data-item-image-preview alt="Image preview" hidden>
      <div class="add-form-actions">
        <button type="submit">Save</button>
        <button type="button" data-cancel-add-item>Cancel</button>
        <button type="button" class="danger" data-delete-item hidden>Delete</button>
      </div>
    </form>
    <ul class="boxes-list reorder-list" data-boxes-list data-reorder="boxes" aria-label="Boxes" hidden></ul>
    <section class="unassigned" data-unassigned data-drop-target hidden>
      <h2>Unassigned</h2>
      <ul class="items-list" data-unassigned-items></ul>
    </section>
    <script type="module" src="./app.js"></script>
  </body>
</html>
